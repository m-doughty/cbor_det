name: CI

on:
  push:
  pull_request:

# The toolchain is pinned: GNAT and GNATprove 16.1.0 are the releases with
# builds for every platform below.
env:
  ALIRE_VERSION: "2.1.1"
  TOOLCHAIN: "gnat_native=16.1.0 gprbuild=26.0.1"

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-15 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
        with:
          version: ${{ env.ALIRE_VERSION }}
          toolchain: ${{ env.TOOLCHAIN }}
      - name: Matrix driver runs every cell and propagates failures
        shell: bash
        run: bash scripts/test-matrix.sh
      - name: Build matrix (-O0/-O2/-O3 x checks off/on, plus contracts)
        shell: bash
        run: bash scripts/matrix.sh

  prove:
    name: prove (${{ matrix.name }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    # Set from the first runs of the shards split by measured time: the
    # longest job took 30 minutes (Windows), the others 18 to 25. A run
    # that hits the limit is an error to rerun, never a failed proof.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # The proof is split into `shards` jobs per platform. `shard` must
      # list every number from 1 to `shards`, once each; otherwise some
      # commands run in no job. Nothing else detects a mismatch: a
      # missing or repeated shard leaves every job passing.
      # scripts/prove.sh checks, in each job, only that the `shards`
      # shards of its rule would cover every command exactly once (and
      # refuses a shard above `shards`), not which shards the matrix runs.
      matrix:
        name: [linux-x86_64, linux-aarch64, macos-arm64, windows-x86_64]
        shard: [1, 2, 3]
        shards: [3]
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-15 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
        with:
          version: ${{ env.ALIRE_VERSION }}
          toolchain: ${{ env.TOOLCHAIN }}
      - name: Generate Alire configuration and build proof dependencies
        shell: bash
        working-directory: tests
        run: alr -n build
      # Every command starts from cold (the script deletes the proof
      # sessions first), so splitting the commands across jobs changes
      # nothing any command proves. This job runs its shard: the script
      # splits the commands by their measured seconds in
      # scripts/prove-costs.txt, which only balances the shards and never
      # changes which commands run; it prints how many of the total it
      # ran, and each command's time. Provers are
      # bounded by steps, not time (see cbor_det.gpr), so a proof does not
      # fail for being slow. The step counts printed are those of the
      # prover that finished first and differ from run to run and platform
      # to platform; only "all proved" is the result. Two proof jobs at a
      # time. The per-command wall-clock guard is UNMEASURED, so none is
      # passed; it is set from these runs' times.
      # The driver's own test does not depend on the shard: it runs in
      # shard 1 of each platform only.
      - name: The proof driver fails on unproved, justified or assumed checks, on a tripped guard and on a broken shard rule (shard 1 only)
        if: matrix.shard == 1
        shell: bash
        run: bash scripts/test-prove.sh
      - name: GNATprove per unit and per subprogram, this shard, with steps (all proved, or the job fails)
        shell: bash
        run: bash scripts/prove.sh --jobs 2 --shard ${{ matrix.shard }}/${{ matrix.shards }}
      # The output of each GNATprove command of this shard, one file per
      # command (tests/obj/prove/NAME.txt: each check with the provers,
      # time and steps that proved it), kept when the proof fails too (a
      # job lost or timed out may keep nothing). They name paths of the
      # runner only.
      - name: Keep the GNATprove output of each command
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prove-output-${{ matrix.name }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: |
            tests/obj/prove/*.txt
            !tests/obj/prove/build.txt
          retention-days: 14
          if-no-files-found: warn

  differential:
    name: differential (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Set from two CI runs: the longest differential job took 18 minutes
    # (Windows). A run that hits the limit is an error to rerun.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-15 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: alire-project/setup-alire@v4
        with:
          version: ${{ env.ALIRE_VERSION }}
          toolchain: ${{ env.TOOLCHAIN }}
      - name: Generate Alire configuration
        shell: bash
        working-directory: tests
        run: alr -n build
      # The ghost specification, executed with contracts on, against the
      # independent reference decoder: corpus (seed 1), head table, and
      # every input of up to 3 bytes.
      - name: Differential test against the reference decoder
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/differential.sh

  decoder:
    name: decoder (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Set from one CI run: the longest decoder job took 17 minutes
    # (Windows), the others 13 to 15. A run that hits the limit is an
    # error to rerun.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-15 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: alire-project/setup-alire@v4
        with:
          version: ${{ env.ALIRE_VERSION }}
          toolchain: ${{ env.TOOLCHAIN }}
      - name: Generate Alire configuration
        shell: bash
        working-directory: tests
        run: alr -n build
      # The decoder against the reference decoder (verdicts on its head
      # table, corpora and every input of up to 3 bytes) and the status
      # oracle (Status and Where), in a plain cell and the contracts
      # cell, with its operation counts and boundary inputs.
      # The runner's own failure modes: a missing input file is reported
      # without its path, and an empty or short corpus or head table, or
      # a blank seed list, fails rather than passing having compared
      # nothing.
      - name: Test runner self-test
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/test-runner.sh
      - name: Decoder tests against the two references
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/decoder-tests.sh
      # Throughput and stack, printed as information: no limit is set
      # from them.
      - name: Decoder measurements (information only)
        shell: bash
        run: bash scripts/decoder-measure.sh

  model:
    name: model (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Set from one CI run: the longest model job took 7 minutes
    # (Windows), the others 5 to 6. A run that hits the limit is an error
    # to rerun.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-15 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: alire-project/setup-alire@v4
        with:
          version: ${{ env.ALIRE_VERSION }}
          toolchain: ${{ env.TOOLCHAIN }}
      - name: Generate Alire configuration
        shell: bash
        working-directory: tests
        run: alr -n build
      # The value relation Same, with the library's contracts on, against
      # the independent denotation oracle: its two pair files (22 000
      # seeded pairs and every ordered pair of the inputs of up to 2
      # bytes), each pinned by its SHA-256, with the uniqueness lemmas
      # executed on every pair.
      - name: Value relation against the denotation oracle
        shell: bash
        env:
          PYTHON: python
        run: bash scripts/model-tests.sh

  gates:
    name: gates (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Set from CI runs: the longest gates job took 17 minutes (Windows;
    # the others 1 to 4). The self-tests start thousands of processes,
    # which Git Bash on Windows does slowly. A run that hits the limit is
    # an error to rerun.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04 }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm }
          - { name: macos-arm64,    os: macos-15 }
          - { name: windows-x86_64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - name: The source gate catches known bypasses, end to end in find, git and staged mode
        shell: bash
        run: bash scripts/check-sources.sh --self-test
      - name: No unproved escape hatches in the library
        shell: bash
        run: bash scripts/check-sources.sh --require-git
      - name: The version gate refuses a mismatch and a non-ASCII heading
        shell: bash
        run: bash scripts/test-version.sh
      - name: Versions agree
        shell: bash
        run: bash scripts/check-version.sh
      - name: The Windows check script fails when a step fails or cannot run
        shell: bash
        run: bash scripts/test-windows-check.sh
      - name: The leakage gate catches each class of leak, end to end in find, git and staged mode
        shell: bash
        run: bash scripts/check-leakage.sh --self-test
      - name: No local paths, names or private references
        shell: bash
        run: bash scripts/check-leakage.sh --require-git
